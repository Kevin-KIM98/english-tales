# main 에 머지되면: 테스트 → APK 빌드·서명 → 앱 안 업데이트용 코드 묶음(zip) 생성
#  → GitHub Pages(https://kevin-kim98.github.io/english-tales/)에 설치 페이지·APK·업데이트 파일 배포
#  → GitHub Release 에도 기록
# 휴대폰 앱은 Pages 의 update.json 을 보고 앱 안에서 바로 업데이트한다.
name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 설치 · 검사 · 테스트
        run: |
          npm ci
          npm run build
          npm run check
          npm test
          echo "NATIVE_VERSION=$(node -p "require('./package.json').nativeVersion")" >> "$GITHUB_ENV"

      - name: 웹 화면을 안드로이드 프로젝트로 복사
        run: npx cap sync android

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ANDROID_KEYSTORE_BASE64 시크릿이 없습니다"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: APK 빌드
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          APK="$PWD/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/english-tales-v$VERSION_NAME.apk"

      - name: 설치 페이지 · 업데이트 파일 만들기
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          # 앱 안 업데이트용: 앱 화면·기능 코드 묶음 (zip 안 맨 위에 index.html)
          (cd public && zip -qr "$SITE/web-$VERSION_NAME.zip" .)
          cp "$RUNNER_TEMP/english-tales-v$VERSION_NAME.apk" "$SITE/english-tales.apk"
          cp site/index.html public/icon.svg docs/install-qr.png docs/install-qr-card.png "$SITE/"
          NOTES=$(git log -1 --format='%s' | head -c 300)
          APK_MB=$(du -m "$SITE/english-tales.apk" | cut -f1)
          node -e '
            const fs = require("fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              version: process.env.VERSION_NAME,
              build: Number(process.env.BUILD_NUMBER),
              native: Number(process.env.NATIVE_VERSION),
              web: `web-${process.env.VERSION_NAME}.zip`,
              apk: "english-tales.apk",
              apkSizeMB: Number(process.argv[3]),
              notes: process.argv[2],
              date: new Date().toISOString(),
            }, null, 2));
          ' "$SITE/update.json" "$NOTES" "$APK_MB"
          cat "$SITE/update.json"
          ls -la "$SITE"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - name: GitHub Pages 배포
        id: pages
        uses: actions/deploy-pages@v5

      - name: GitHub Release 에 기록
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --format='%s%n%n%b' | sed '/^Co-Authored-By/d')
          gh release create "v$VERSION_NAME" \
            "$RUNNER_TEMP/english-tales-v$VERSION_NAME.apk" \
            "$RUNNER_TEMP/site/english-tales.apk" \
            "$RUNNER_TEMP/site/web-$VERSION_NAME.zip" \
            --title "English Tales $VERSION_NAME" \
            --notes "$NOTES

          ### 설치 / 업데이트
          - 처음 설치: https://kevin-kim98.github.io/english-tales/ (또는 아래 english-tales.apk)
          - 이미 설치했다면: 앱 안에서 자동으로 업데이트됩니다."
