# main 에 머지되면: 테스트 → 안드로이드 APK 빌드·서명 → GitHub Release 로 배포
# 휴대폰 앱은 시작할 때 최신 Release 를 확인해 '업데이트' 를 알려 줍니다.
name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 설치 · 검사 · 테스트
        run: |
          npm ci
          npm run build
          npm run check
          npm test

      - name: 웹 화면을 안드로이드 프로젝트로 복사
        run: npx cap sync android

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ANDROID_KEYSTORE_BASE64 시크릿이 없습니다"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: APK 빌드
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          APK="$PWD/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/english-tales-v$VERSION_NAME.apk"
          # 이름이 고정된 사본: 설치 QR 코드(releases/latest/download/english-tales.apk)가 항상 최신 버전을 받게 한다
          cp "$APK" "$RUNNER_TEMP/english-tales.apk"

      - name: GitHub Release 로 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --format='%s%n%n%b' | sed '/^Co-Authored-By/d')
          gh release create "v$VERSION_NAME" "$RUNNER_TEMP/english-tales-v$VERSION_NAME.apk" "$RUNNER_TEMP/english-tales.apk" \
            --title "English Tales $VERSION_NAME" \
            --notes "$NOTES

          ### 설치 / 업데이트
          휴대폰에서 아래 **english-tales-v$VERSION_NAME.apk** 를 눌러 내려받은 뒤 '설치'를 누르세요.
          이미 설치되어 있다면 앱이 시작할 때 새 버전을 알려 줍니다."
