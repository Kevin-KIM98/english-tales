# PR을 올리면 자동으로 검사합니다. 통과해야 main 에 머지할 수 있습니다.
# 머지 후 APK 빌드·배포는 android.yml 이 합니다.
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
