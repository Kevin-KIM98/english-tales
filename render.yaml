# Render 블루프린트: GitHub main 브랜치에 머지 → CI 통과 → 자동 배포
# 처음 한 번 Render 대시보드에서 New → Blueprint → 이 저장소를 선택하면 됩니다.
services:
  - type: web
    name: english-tales
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 선택: Claude 해석 엔진을 쓰려면 Render 대시보드에서 값을 입력 (저장소에는 절대 넣지 마세요)
      - key: ANTHROPIC_API_KEY
        sync: false
